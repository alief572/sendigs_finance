.receipt-section{border:1px solid #e1e7ef;border-radius:6px;padding:20px;margin-bottom:20px;background:#fff;min-width:0}

function draftReceipt(){

 if(!b.bp_no)err='Isi nomor bukti potong.';
 else if(same.some(function(x){return x.customer_id!==b.customer_id;}))err='Nomor bukti potong ini sudah dipakai untuk customer lain.';
 else if(!b.npwp)err='Isi NPWP / NITKU pemotong.';
 else if(!b.masa)err='Isi masa pajak.';
 else if(!isFinite(b.value)||!b.value)err='Isi nilai PPh 23 untuk invoice ini sesuai bukti potong.';
 else if(b.value!==sys){diff=true;err='Nilai di bukti potong (Rp '+money(b.value)+') berbeda Rp '+money(Math.abs(b.value-sys))+' dari PPh 23 di sistem (Rp '+money(sys)+'). Konfirmasi ke customer dulu.';}
 if(!err&&same.length)info=' Nomor ini juga dipakai untuk invoice '+same.map(function(x){return x.lines[0].invoice_no;}).join(', ')+' (satu bukti potong untuk beberapa invoice).';
 var j=bpJournal(b);
 $('#b-banner').attr('class','receipt-control-banner '+(err?(diff?'banner-danger':'banner-warning'):'banner-success')).text(err||('Siap diproses.'+(j.length?'':' Invoice sebelum tanggal berlaku, jadi hanya dicatat tanpa jurnal.')+info));
 $('#b-journal').html(jtable(j,b.bp_date,{empty:'Tidak ada jurnal: PPh 23 invoice ini sudah dijurnal saat penerimaan (sebelum tanggal berlaku)'}));
 $('#b-save').prop('disabled',!!err);
}
function saveBp(){
 var b=draftBp();if(!window.confirm('Simpan bukti potong'+(bpJournal(b).length?' dan jurnalnya':'')+'?'))return;
 var seq=S.seq.bpt++,d=b.bp_date;b.no='BPT/'+d.substr(0,4)+'/'+d.substr(5,2)+'/'+pad(seq,4);b.journal_no=bpJournal(b).length?'JUR-BPT-'+d.substr(0,7).replace('-','')+'-'+pad(seq,4):'';b.created=TODAY;b.file='(contoh).pdf';delete b.value;
 S.bukti.push(b);
 var l=b.lines[0],p=pphOf(l.invoice_no);p.status='SELESAI';p.bp_no=b.no;if(!l.legacy){arOf(l.invoice_no).saldo-=l.amount;}
 save();$('#m-modal').modal('hide');flash('Bukti potong <b>'+esc(b.bp_no)+'</b> untuk invoice <b>'+esc(l.invoice_no)+'</b> tersimpan ('+b.no+'). Status <b>Selesai</b>.');route2();
}
function route2(){keepFlash=true;setTimeout(route,350);}

/* ---------- Detail per invoice ---------- */
function pageDetail(no){
 var p=pphOf(no),a=arOf(no);
 if(!p||!a){$('#page').html('<div class="alert alert-warning">Data tidak ditemukan.</div>');return;}
 var r=receiptByNo(p.receipt_no),s=setorByNo(p.setor_no),b=bpByNo(p.bp_no),cn=cust(p.customer_id).name;
 var line=null;r.lines.forEach(function(l){if(l.doc_no===no)line=l;});
 var tagihan=a.penjualan+a.ppn,paid=line.saldo-line.sisa-(p.mode==='POTONG'?p.amount:0)-line.admin;
 var steps='<li class="done"><h4>Invoice '+esc(no)+'</h4><div class="meta">'+jdate(a.date)+' · Penjualan Rp '+money(a.penjualan)+' · PPN Rp '+money(a.ppn)+' · Piutang Rp '+money(tagihan)+' (tidak berubah)</div></li>';
 steps+='<li class="done"><h4>Penerimaan '+esc(r.no)+' · '+modeBadge(p.mode)+'</h4><div class="meta">'+jdate(r.date)+' · '+esc(bankTxt(r.bank))+' · '+(p.legacy?'<span class="st st-legacy">Sebelum berlaku: PPh 23 sudah dijurnal di sini (cara lama)</span>':'Jurnal '+esc(r.journal_no))+'</div>'+jtable(receiptJournal(r),r.date)+'</li>';
 if(p.mode==='TITIP')steps+=s?'<li class="done"><h4>Setor Titipan '+esc(s.no)+'</h4><div class="meta">'+jdate(s.date)+' · Masa '+masaTxt(s.masa)+' · Kode billing '+esc(s.billing)+' · NTPN '+esc(s.ntpn)+' · Jurnal '+esc(s.journal_no)+'</div>'+jtable(setorJournal(s),s.date)+'</li>'
  :'<li class="wait"><h4>Setor Titipan</h4><div class="meta"><span class="st st-setor">Belum disetor</span> · titipan Rp '+money(p.amount)+' sudah '+days(p.receipt_date)+' hari. <button type="button" class="btn btn-xs btn-success act-setor" data-no="'+esc(no)+'"><i class="fa fa-paper-plane"></i> Setor</button></div></li>';
 steps+=b?'<li class="done"><h4>Bukti Potong '+esc(b.bp_no)+'</h4><div class="meta">'+jdate(b.bp_date)+' · Masa '+masaTxt(b.masa)+' · Pemotong '+esc(cn)+' ('+esc(b.npwp)+') · Dicatat '+esc(b.no)+(b.journal_no?' · Jurnal '+esc(b.journal_no):' · tanpa jurnal')+' · <a href="#" onclick="return false">'+esc(b.file||'file.pdf')+'</a></div>'+jtable(bpJournal({customer_id:b.customer_id,bp_no:b.bp_no,lines:b.lines.filter(function(l){return l.invoice_no===no;})}),b.bp_date,{empty:'Tanpa jurnal: PPh 23 sudah dijurnal saat penerimaan (sebelum berlaku)'})+'</li>'
  :'<li class="wait"><h4>Bukti Potong</h4><div class="meta"><span class="st st-bp">Menunggu</span>'+(p.mode==='TITIP'&&!s?' · bisa diinput setelah titipan disetor':' · <button type="button" class="btn btn-xs btn-success act-bp" data-no="'+esc(no)+'"><i class="fa fa-paper-plane"></i> Bukti Potong</button>')+'</div></li>';
 var html='<div class="kwitansi-page receipt-page receipt-detail-page"><div class="box box-primary"><div class="box-header with-border"><h3 class="box-title">Detail PPh 23 · '+esc(no)+' <span class="newtag">BARU</span></h3><a class="btn btn-default" href="#pph23"><i class="fa fa-arrow-left"></i> Kembali</a></div><div class="box-body">'+
 '<div class="ar-sum"><div>Customer<b style="font-size:14px">'+esc(cn)+'</b></div><div>Piutang (Penjualan + PPN)<b>'+money(tagihan)+'</b></div><div>Dibayar via bank<b>'+money(paid)+'</b></div><div>PPh 23<b>'+money(p.amount)+'</b></div><div>Saldo piutang sekarang<b>'+money(a.saldo)+'</b></div><div>Status<b style="font-size:13px">'+statusBadge(p)+'</b></div></div>'+
 '<ul class="timeline-pph">'+steps+'</ul>'+COA_NOTE+'</div></div></div>';
 $('#page').html(html);
 $('#page .act-setor').on('click',function(){openSetorModal($(this).attr('data-no'));});
 $('#page .act-bp').on('click',function(){openBpModal($(this).attr('data-no'));});
}
