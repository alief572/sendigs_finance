<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SENDIGS – Invoicing, Monitoring Piutang, Follow Up Piutang &amp; Dashboard Plan Bayar (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#ecf0f5; --panel:#ffffff; --text:#333a40; --muted:#6c757d; --line:#dfe3e8; --row:#f7f9fb;
  --top:#3f8bba; --side:#222d32; --side-2:#2c3b41; --side-text:#b8c7ce; --side-active:#ffffff;
  --green:#00a65a; --orange:#f39c12; --red:#dd4b39; --blue:#2f7fb8; --cyan:#00c0ef; --lock:#eef0f2;
  --chg:#8e44ad; --input:#ffffff; --pill-text:#ffffff;
  --stp-off:#d3d9df; --stp-done:#2b7a4b; --stp-cur:#a8660b; --stp-cur-bg:#fdf0d5; --stp-cur-t:#9a5b06; --stp-done-bg:#e1f3ea; --stp-done-t:#1e6b40; --stp-bad-bg:#fbe3e0; --stp-bad-t:#a8321f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15191d; --panel:#1f252a; --text:#dde3e8; --muted:#9aa5ae; --line:#323b43; --row:#252c32;
    --top:#2a6a92; --side:#11161a; --side-2:#1a2228; --side-text:#9fb0b8; --side-active:#ffffff;
    --lock:#2a3137; --input:#161b1f; --chg:#c39bd3; color-scheme:dark;
    --stp-off:#3a444d; --stp-done:#4fbf82; --stp-cur:#f0a93b; --stp-cur-bg:rgba(240,169,59,.18); --stp-cur-t:#f3bd66; --stp-done-bg:rgba(79,191,130,.16); --stp-done-t:#7fd6a5; --stp-bad-bg:rgba(221,75,57,.2); --stp-bad-t:#f29a8e;
  }
}
:root[data-theme="dark"]{
  --bg:#15191d; --panel:#1f252a; --text:#dde3e8; --muted:#9aa5ae; --line:#323b43; --row:#252c32;
  --top:#2a6a92; --side:#11161a; --side-2:#1a2228; --side-text:#9fb0b8; --side-active:#ffffff;
  --lock:#2a3137; --input:#161b1f; --chg:#c39bd3; color-scheme:dark;
  --stp-off:#3a444d; --stp-done:#4fbf82; --stp-cur:#f0a93b; --stp-cur-bg:rgba(240,169,59,.18); --stp-cur-t:#f3bd66; --stp-done-bg:rgba(79,191,130,.16); --stp-done-t:#7fd6a5; --stp-bad-bg:rgba(221,75,57,.2); --stp-bad-t:#f29a8e;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr;min-height:100%}
.top{grid-column:1/-1;display:flex;align-items:center;background:var(--top);color:#fff;height:46px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--top)}
.brand{width:230px;font-weight:700;font-size:18px;padding:0 18px;background:rgba(0,0,0,.12);height:100%;display:flex;align-items:center}
.top .sp{flex:1}
.top label{display:flex;gap:6px;align-items:center;padding:0 16px;font-size:13px;cursor:pointer}
.side{background:var(--side);color:var(--side-text);padding:10px 0;font-size:13px}
.side .grp{padding:9px 16px;color:#fff;background:var(--side-2);font-weight:600;margin-top:8px}
.side a{display:block;padding:7px 16px 7px 28px;color:var(--side-text);text-decoration:none;cursor:pointer}
.side a.on{color:var(--side-active);font-weight:600;border-left:3px solid var(--top);padding-left:25px}
.side a:hover{color:#fff}
.side a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
main{padding:16px 18px 40px;min-width:0}
h1{font-size:22px;font-weight:400;margin:0 0 14px}
.panel{background:var(--panel);border-top:3px solid var(--line);border-radius:3px;padding:14px;margin-bottom:16px}
.panel.hl{border-top-color:var(--top)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.btn{border:0;border-radius:3px;padding:6px 12px;cursor:pointer;color:#fff;background:var(--green);font-weight:600;font-size:13px}
.btn.o{background:var(--orange)}.btn.r{background:var(--red)}.btn.c{background:var(--cyan)}.btn.g{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tabhint{margin:-4px 0 12px;padding:7px 12px;background:rgba(47,127,184,.10);border-left:3px solid var(--blue);font-size:13px}
.searchbox{width:280px}.searchbox input{width:100%}
input[type=search]{background:var(--input);border:1px solid var(--line);border-radius:3px;padding:5px 7px;width:100%}
.okmsg{background:rgba(0,166,90,.12);border:1px solid rgba(0,166,90,.45);color:var(--text);border-radius:3px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:1px solid transparent;border-bottom:0;background:none;padding:7px 14px;cursor:pointer;color:var(--muted);border-radius:3px 3px 0 0}
.tabs button.on{border-color:var(--line);background:var(--panel);color:var(--text);font-weight:600;margin-bottom:-1px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:700;font-size:13px;white-space:nowrap}
tbody tr:nth-child(odd){background:var(--row)}
td.num,th.num{text-align:right;white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}
.no{white-space:nowrap;font-weight:600}
.sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:700;color:var(--pill-text);white-space:nowrap}
.pill.W{background:var(--orange)}.pill.A{background:var(--green)}.pill.R{background:var(--red)}.pill.P{background:var(--blue)}
ol.items{margin:0;padding-left:18px}
.note{color:var(--red);font-size:12.5px}
.ref{font-size:12px;color:var(--blue)}
.kpi{display:flex;flex-wrap:wrap;gap:20px;margin:4px 0 12px;font-size:13px}
.kpi b{font-size:16px;display:block}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 24px;margin-bottom:12px;font-size:13px}
.grid2 span{color:var(--muted);display:block;font-size:12px}
input[type=text],input[type=tel],input[type=number],textarea,select{background:var(--input);border:1px solid var(--line);border-radius:3px;padding:5px 7px;width:100%}
textarea{min-height:52px;resize:vertical}
.lockrow td{background:var(--lock);color:var(--muted)}
.lockrow input,.lockrow textarea{background:var(--lock)}
.tag{display:table;margin-top:4px;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:3px;color:#fff;background:var(--red)}
.tag.back{background:var(--orange)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 10px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.seg button.on.A{background:var(--green);color:#fff;font-weight:700}
.seg button.on.R{background:var(--red);color:#fff;font-weight:700}
.err{color:var(--red);font-size:12px;margin-top:3px}
.dsum{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:3px;margin-top:12px}
.dsum .sp{flex:1}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--side);color:#fff;padding:10px 14px;border-radius:3px;max-width:360px;font-size:13px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:calc(40px + env(safe-area-inset-top,0px)) 12px 20px;z-index:15;overflow:auto}
.modal.show{display:flex}
.modal .panel{width:min(960px,100%)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mhead h2{font-size:17px;margin:0;font-weight:600}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 10px}
body.show-chg .chg{outline:2px dashed var(--chg);outline-offset:2px}
.legend{display:none;font-size:12.5px;color:var(--chg);margin-bottom:10px}
body.show-chg .legend{display:block}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .brand{width:auto}
  .side{display:flex;overflow-x:auto;padding:0;white-space:nowrap}
  .side .grp{display:none}
  .side a{padding:10px 14px}
  .side a.on{border-left:0;border-bottom:3px solid var(--top);padding-left:14px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

.side .sys{padding:14px 16px 2px;font-size:11.5px;color:var(--side-text);opacity:.8}
.top .tbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:3px;padding:4px 10px;cursor:pointer;font-size:12.5px;margin-right:6px}
details.cases{border:1px solid var(--line);border-left:3px solid var(--chg);border-radius:3px;padding:8px 12px;margin-bottom:12px;background:var(--row)}
details.cases summary{cursor:pointer;font-weight:600}
details.cases ol{margin:8px 0 2px;padding-left:20px}
details.cases li{margin:3px 0}
.warn{border:1px solid var(--orange);background:rgba(243,156,18,.10);border-radius:3px;padding:8px 10px;font-size:13px;margin-top:10px}
.flag{display:block;font-size:11.5px;color:var(--orange);font-weight:700}
.jalur{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:3px;border:1px solid var(--line);white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input{width:auto;min-width:170px}
.mini{width:90px!important}
.grid2 .jalur{display:inline-block}
.ro{background:var(--lock);border:1px solid var(--line);border-radius:2px;padding:5px 8px;min-height:30px;font-size:13px;color:var(--text);margin-bottom:2px;word-break:break-word}
.ro.r{text-align:right;font-variant-numeric:tabular-nums}
.ro.tall{min-height:52px}
.apphead{align-items:end}
.apptbl td{vertical-align:top}
.apptbl tr.rej td{background:rgba(221,75,57,.07)}
.apptbl tr.totrow td{background:var(--row);border-top:2px solid var(--line)}
.genwrap{margin-top:14px;max-width:520px}
.genwrap textarea{margin-top:6px;min-height:96px}
.appbtns{margin-top:12px}
.btn.bl{background:var(--blue)}
.btn.ic{min-width:30px;padding:3px 8px}
.doclink{color:var(--blue);font-size:12.5px}
.apptbl tr.decrow td{border-top:0;padding-top:0}
.decbox{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 14px;padding:4px 0 6px}
.declbl{font-size:12px;color:var(--muted);font-weight:700;padding-top:5px}
.decnote{flex:1;min-width:260px;max-width:620px}
.apptbl tbody tr:nth-child(odd){background:transparent}
.apptbl tbody tr:not(.decrow) td{border-bottom:0}
.tag.cic{background:var(--blue)}
.hiddennote{margin-top:10px;font-size:13px;padding:8px 10px;border:1px dashed var(--line);border-radius:3px;color:var(--muted)}
.hiddennote a{color:var(--blue)}
.masa{display:flex;align-items:center;gap:6px}
.masa select{width:auto}
.prog{height:6px;background:var(--line);border-radius:3px;margin:4px 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue)}
.mtbl td{vertical-align:top}
.masainfo{margin-top:6px;font-size:12.5px}.masainfo .pill{margin-left:4px}
/* alur klik: kembali, action bar menempel, badge menu, transisi */
.back{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;font-weight:600;font-size:13px;margin:-6px 0 10px;display:inline-flex;gap:6px;align-items:center}
.back:hover{text-decoration:underline}
h1 small{font-size:14px;color:var(--muted);margin-left:8px}
.actbar{position:sticky;bottom:0;z-index:3;background:var(--panel);border-top:1px solid var(--line);padding:10px 0;margin:14px 0 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 -8px 10px -10px rgba(0,0,0,.35)}
.actbar .sp{flex:1}
.actbar .dsum{border:0;padding:0;margin:0}
.side a .cnt{float:none;flex:none;background:var(--orange);color:#fff;border-radius:9px;font-size:11px;font-weight:700;padding:0 7px;line-height:18px;margin-left:6px}
.btn{transition:filter .12s}.btn:hover:not([disabled]){filter:brightness(.93)}
#main.enter>*{animation:enter .18s ease-out}
.modal.show .panel{animation:enter .15s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}}
tr.flash td{animation:flash 2.6s ease-out}
@keyframes flash{from{background:rgba(0,166,90,.28)}}
.cfm table{min-width:0}
.cfm .bar{justify-content:flex-end;margin:14px 0 0}
fieldset.plain{border:0;padding:0;margin:0;min-width:0}
.warn a{color:var(--blue);font-weight:600;cursor:pointer}
@media (prefers-reduced-motion:reduce){#main.enter>*,.modal.show .panel,tr.flash td{animation:none}}
/* ===== Monitoring Piutang ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:3px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;width:100%}
.card:hover{filter:brightness(.98);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card.on{box-shadow:0 0 0 2px var(--cyan)}
.card.tot{border-top-color:var(--blue)}
.card.nb{border-top-color:#95a5a6;cursor:default;background:#fafbfc}.card.nb .cv{color:var(--muted)}
.card.L{border-top-color:var(--green)}.card.P{border-top-color:var(--orange)}.card.M{border-top-color:var(--red)}
.card .ct{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center}
.card .cv{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;word-break:break-word}
.card.L .cv{color:var(--green)}.card.P .cv{color:var(--orange)}.card.M .cv{color:var(--red)}
.card .age{display:inline-block;align-self:flex-start;font-size:12px;font-weight:700;padding:2px 8px;border-radius:3px;background:var(--row);border:1px solid var(--line)}
.card .cm{font-size:12.5px;color:var(--muted)}
.card .cm b{color:var(--text)}
.card .prog{margin:4px 0 0}
.card .cardxl{display:flex;justify-content:flex-end;margin-top:8px}
.card.L .prog i{background:var(--green)}.card.P .prog i{background:var(--orange)}.card.M .prog i{background:var(--red)}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:6px 0 2px}
.stack i{display:block;height:100%}
.stack .L{background:var(--green)}.stack .P{background:var(--orange)}.stack .M{background:var(--red)}
.pill.L{background:var(--green)}.pill.P{background:var(--orange)}.pill.M{background:var(--red)}.pill.C{background:var(--blue)}
.umur{font-weight:700;font-variant-numeric:tabular-nums}
.umur.L{color:var(--green)}.umur.P{color:var(--orange)}.umur.M{color:var(--red)}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(63,139,186,.08)}
tfoot td{font-weight:700;background:var(--row);border-top:2px solid var(--line)}
.fl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.fl select,.fl input{min-width:170px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:12px;background:var(--row);border:1px solid var(--line)}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);font-weight:700;padding:0}
.empty{padding:26px;text-align:center;color:var(--muted)}
.bk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;min-width:240px}
.bk span{font-size:12px;font-variant-numeric:tabular-nums;text-align:right;padding:1px 4px;border-radius:2px}
.bk .L{background:rgba(0,166,90,.12)}.bk .P{background:rgba(243,156,18,.14)}.bk .M{background:rgba(221,75,57,.13)}
.z{opacity:.35}
.asof{font-size:12.5px;color:var(--muted)}
.sortbtn{border:0;background:none;padding:0;font:inherit;font-weight:700;cursor:pointer;color:inherit;white-space:nowrap}
.sortbtn::after{content:" \2195";opacity:.4}
.sortbtn.asc::after{content:" \2191";opacity:1}.sortbtn.desc::after{content:" \2193";opacity:1}
/* ===== Follow Up Piutang ===== */
.excl{background:var(--row);border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:3px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.excl a{color:var(--blue);font-weight:600;cursor:pointer}
.pbcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:900px){.pbcards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.pbcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pbcard{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:3px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.pbcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.pbcard.pball{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 24px;border-top-color:var(--blue)}
.pbcard.pball .cv{color:var(--blue);font-size:22px;display:block}
.pbcard.has{border-top-color:var(--green)}.pbcard.lewat{border-top-color:var(--red)}
.pbcard.now{background:rgba(0,192,239,.06)}.pbcard.on{box-shadow:0 0 0 2px var(--cyan)}
.pbcard .ct{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:6px;align-items:center}
.pbcard .cv{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;word-break:break-word}
.pbcard.has .cv{color:var(--green)}.pbcard.lewat .cv{color:var(--red)}
.pbcard .cm{font-size:12.5px;color:var(--muted)}
.pbcard .rea{font-size:12.5px;color:var(--blue);margin-top:4px;padding-top:4px;border-top:1px dashed var(--line)}
.pbcard .rea b{color:var(--text)}
.pbcard .cv.rea{border:0;padding:0;margin:0;font-size:22px;color:var(--blue)}
.pbcard .lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
.pbcard.pball > span{display:flex;flex-direction:column;gap:2px;min-width:220px}
.tabs .cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:9px;background:var(--line);color:var(--text);font-size:11.5px;font-weight:700;text-align:center;margin-left:4px}
.tabs .cnt.red{background:var(--red);color:#fff}
.tabs button.on .cnt{background:var(--blue);color:#fff}
.stat{display:inline-flex;align-items:baseline;gap:5px;padding:6px 12px;border:1px solid var(--line);border-radius:3px;background:var(--panel);cursor:pointer;font-size:13px}
.stat b{font-size:16px}
.stat.on{box-shadow:0 0 0 2px var(--cyan)}
.stat.late b{color:var(--red)}
.pill.st-belum_kirim{background:#8a949c}.pill.st-dikirim{background:var(--blue)}.pill.st-diterima{background:var(--cyan)}.pill.st-plan_bayar{background:var(--green)}.pill.st-close{background:#555}.pill.int{background:#8a949c}
.late{color:var(--red)}
input[type=date]{background:var(--input);border:1px solid var(--line);border-radius:3px;padding:4px 6px;width:100%}
.frm h3{font-size:14px;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.frm h3:first-of-type{margin-top:4px}

function calc(r){
  const terbayar = r.bayar.reduce((a, b) => a + b.nom, 0), sisa = r.nilai - terbayar;
  const umur = r.terima ? days(r.terima) : null;
  const next = r.planBayar ? -1 : r.fu.findIndex(f => f.plan && !f.aktual); // ada rencana bayar = follow up berhenti
  const status = r.closed ? 'close' : r.planBayar ? 'plan_bayar' : r.terima ? 'diterima' : r.kirim ? 'dikirim' : 'belum_kirim';
  // INV-R-08: nilai plan = sisa piutang saat plan bayar disimpan. Data contoh lama: nilai - pembayaran sebelum tanggal terima.
  const planNom = r.planNominal != null ? r.planNominal : r.nilai - r.bayar.filter(b => r.terima && b.tgl < r.terima).reduce((a, b) => a + b.nom, 0);
  return {...r, terbayar, sisa, umur, cat: umur === null ? null : catOf(umur), planNom,
    next: next < 0 ? null : {ke: next + 1, tgl: r.fu[next].plan}, status,
    fuTahap: r.planBayar ? 'selesai' : r.fu[3].aktual ? (next < 0 ? 'selesai' : 'tambahan') : next < 0 ? null : String(next + 1),
    baru: isBaru(r, status)};
}

// Sama dengan Piutang_aging::search_text di server (dipakai Export Excel). Beberapa kata = semua kata harus cocok.
function searchText(r){
  const parts = [r.no, r.cust, r.prog, r.comp, r.spk, r.top, r.via, r.ketKirim, r.resi, r.closed && r.closed.ket].filter(Boolean).map(String);
  if (r.topKe) parts.push('TOP ' + r.topKe);
  [r.tgl, r.kirim, r.terima, r.planBayar, r.closed && r.closed.tgl].forEach(d => {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || '');
    if (m) parts.push(m[0] + ' ' + m[3] + '-' + m[2] + '-' + m[1] + ' ' + fdate(m[0]));
  });
  [r.nilai, r.sisa, r.terbayar].forEach(n => { if (n !== undefined && n !== null) { n = Math.round(n); parts.push(n + ' ' + n.toLocaleString('id-ID')); } });
  if (r.umur !== null && r.umur !== undefined) parts.push(r.umur + ' hari');
  if (r.cat) parts.push(CAT[r.cat].nm);
  if (r.status) parts.push(ST[r.status]);
  if (r.next) parts.push('FU ' + r.next.ke);
  return parts.join(' | ').toLowerCase();
}
const searchMatch = (r, q) => { const hay = searchText(r); return q.toLowerCase().split(/\s+/).every(w => !w || hay.includes(w)); };

function lamaTagih(terima){
  const a = new Date(terima + 'T00:00:00'), b = new Date(TODAY_ISO + 'T00:00:00');
  let m = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth(), d = b.getDate() - a.getDate();
  if (d < 0) m--;
  if (m < 1) return Math.round((b - a) / 864e5) + ' hari';
  const sisa = new Date(a.getFullYear(), a.getMonth() + m, a.getDate()) < b;
  return (sisa ? 'lebih dari ' : '') + m + ' bulan';
}

// Daftar sesuai tab + filter (dipakai tabel dan Export Excel).
function fuList(base){
  return fuFilter(base).sort((a, b) => (b.baru - a.baru) || (a.baru ? (b.changed > a.changed ? 1 : b.changed < a.changed ? -1 : 0) : 0));
}
function fuFilter(base){
  const fuOk = r => !state.fuFu || state.fuTab !== 'open' || (state.fuFu === 'belum' ? !r.fuTahap : r.fuTahap === state.fuFu);
  return base.filter(r => {
    if (!fuOk(r)) return false;
    if (state.fuTab !== 'open' || !state.fuStatus) return true;
    if (state.fuStatus === 'lewat') return fuLate(r);
    if (r.status !== state.fuStatus) return false;
    if (state.fuStatus === 'plan_bayar'){
      if (state.fuThn && r.planBayar.slice(0, 4) !== state.fuThn) return false;
      if (state.fuBulan && +r.planBayar.slice(5, 7) !== +state.fuBulan) return false;
    }
    return true;
  });
}

  if (r.kirim && !(terimaLock && (r.resi || '').trim())) r.resi = v('resi');
  if (!terimaLock) Object.assign(r, {terima: v('terima') || r.terima || null, ketTerima: v('ketTerima')});
  if (v('planBayar') && !r.planBayar) r.planNominal = sisaNow; // nilai plan = sisa saat plan dibuat
  Object.assign(r, {
    fu: idx.map(i => ({plan: v('plan' + i) || null, aktual: v('akt' + i) || null, ket: v('ket' + i)})), pic: v('pic') || r.pic, picTelp: v('picTelp') || r.picTelp, planBayar: v('planBayar') || null, ketPlan: v('ketPlan')});
  r.log.unshift({wkt: TODAY_ISO + ' ' + new Date().toTimeString().slice(0, 5), user:'Finance AR', aksi:'simpan',
    isi: [r.terima && 'Tgl terima ' + fdate(r.terima), r.fu.map((f, i) => f.aktual ? 'FU' + (i + 1) + ' ✓' : '').filter(Boolean).join(', '), r.planBayar && 'Plan bayar ' + fdate(r.planBayar)].filter(Boolean).join(' · ') || 'Data pengiriman'});
  const after = calc(r).status, moved = after !== before;
  if (moved){ r.statusFrom = before; r.changed = TODAY_ISO + ' ' + new Date().toTimeString().slice(0, 5); }
  closeModal(); state.flash = r.no; renderFU();
  const pindah = moved && state.fuStatus && state.fuStatus !== after;
  showMsg('Data follow up ' + r.no + ' tersimpan.' + (pindah ? ' Invoice pindah ke tab ' + tabLabel(after) + '.' : ''), pindah ? after : null);
}

/* ================= Export Excel (mockup: file dibuat di browser, format sama dengan export server) ================= */
const xd = iso => iso ? new Date(iso + 'T00:00:00') : '';
const NUM = '#,##0;(#,##0);-';
// sheets: [{name, aoa, widths, fmt: {kolom: format}, from: baris data pertama (1-based)}]
function xlsxDownload(filename, sheets){
  if (!window.XLSX){ toast('Library Excel (SheetJS) belum termuat – butuh koneksi internet untuk export di mockup.'); return false; }
  const wb = XLSX.utils.book_new();
  sheets.forEach(sh => {
    const ws = XLSX.utils.aoa_to_sheet(sh.aoa, {cellDates: true});
    const range = XLSX.utils.decode_range(ws['!ref']);
    Object.entries(sh.fmt || {}).forEach(([col, z]) => {
      const c = XLSX.utils.decode_col(col);
      for (let r = (sh.from || 1) - 1; r <= range.e.r; r++){ const cell = ws[XLSX.utils.encode_cell({r, c})]; if (cell) cell.z = z; }
    });
    ws['!cols'] = (sh.widths || []).map(wch => ({wch}));
    XLSX.utils.book_append_sheet(wb, ws, sh.name);
  });
  XLSX.writeFile(wb, filename);
  return true;
}
const F_ = f => ({t: 'n', f});

function exportPB(){
  const m = state.pbMonth, all = pbRows().slice().sort((a, b) => a.planBayar < b.planBayar ? -1 : a.planBayar > b.planBayar ? 1 : a.no.localeCompare(b.no));

    ...reals.map((p, i) => { const x = reaInfo(p); return [i + 1, BULAN[+p.tgl.slice(5, 7) - 1], p.r.no, xd(p.r.tgl), p.r.cust, p.r.prog, p.r.comp, xd(p.r.planBayar), xd(p.tgl), ketLbl(x.sel), p.nom, p.no, p.r.sisa, p.r.nilai, REA_ST[x.st]]; }),
    ...(reals.length ? [['', '', '', '', '', '', '', '', '', 'Total', F_(`SUM(K5:K${rlast})`)]] : [])];
  const last = Math.max(5, rows.length + 4);
  const rin = [[judul + ' - Rincian Invoice'], [info], [],
    ['No', 'Bulan', 'Tgl Plan Bayar', 'Ket Plan Bayar', 'No Invoice', 'Tgl Invoice', 'Customer', 'Project', 'Company', 'Nilai Invoice', 'Nilai Plan', 'Sisa Piutang Sekarang', 'Umur (hari)', 'Kategori', 'Status Invoice'],
    ...rows.map((r, i) => [i + 1, BULAN[+r.planBayar.slice(5, 7) - 1], xd(r.planBayar), r.ketPlan, r.no, xd(r.tgl), r.cust, r.prog, r.comp, r.nilai, r.planNom, r.sisa, r.umur === null ? '' : r.umur, r.cat ? CAT[r.cat].nm : '', r.closed ? 'Close' : r.sisa <= 0 ? 'Lunas, belum close' : 'Belum lunas']),
    ...(rows.length ? [['', '', '', '', '', '', '', '', 'Total', F_(`SUM(J5:J${last})`), F_(`SUM(K5:K${last})`), F_(`SUM(L5:L${last})`)]] : [])];
  const sheets = [{name: 'Rincian', aoa: rin, from: 5, fmt: {C: 'dd-mm-yyyy', F: 'dd-mm-yyyy', J: NUM, K: NUM, L: NUM}, widths: [5, 11, 14, 28, 14, 12, 34, 32, 10, 16, 16, 16, 11, 14, 18]},
    {name: 'Realisasi', aoa: rea, from: 5, fmt: {D: 'dd-mm-yyyy', H: 'dd-mm-yyyy', I: 'dd-mm-yyyy', K: NUM, M: NUM, N: NUM}, widths: [5, 11, 14, 12, 34, 30, 10, 14, 13, 18, 16, 15, 16, 16, 18]}];
  if (!m){
    const sum = [[judul + ' - Ringkasan per Bulan'], [info], [], ['Bulan', 'Jumlah Invoice', 'Total Plan Bayar', 'Jumlah Penerimaan', 'Total Realisasi'],
      ...BULAN.map((b, i) => [b, F_(`COUNTIFS(Rincian!$B$5:$B$${last},A${i + 5})`), F_(`SUMIFS(Rincian!$K$5:$K$${last},Rincian!$B$5:$B$${last},A${i + 5})`),
        F_(`COUNTIFS(Realisasi!$B$5:$B$${rlast},A${i + 5})`), F_(`SUMIFS(Realisasi!$K$5:$K$${rlast},Realisasi!$B$5:$B$${rlast},A${i + 5})`)]),
      ['Total', F_('SUM(B5:B16)'), F_('SUM(C5:C16)'), F_('SUM(D5:D16)'), F_('SUM(E5:E16)')], [], ['Kolom B-C menghitung dari sheet Rincian (plan = sisa piutang saat plan dibuat, termasuk invoice yang sudah close), kolom D-E dari sheet Realisasi (penerimaan).']];
    sheets.unshift({name: 'Ringkasan', aoa: sum, from: 5, fmt: {C: NUM, E: NUM}, widths: [16, 16, 20, 18, 20]});

}

      <div class="table-scroll"><table class="jr"><thead><tr>

  }

  const tim = r => `<div>${esc(r.leader)}</div><div class="sub">Sales: ${esc(r.sales)}</div>`;
  const custCell = r => `<div class="cust">${esc(r.customer)}</div><div class="sub">Project: ${esc(r.project)}</div>`;
  const has = (q, arr) => !q || arr.join(' ').toLowerCase().includes(q);
  // Tab Konsultasi: satu baris = termin berikutnya yang belum di-invoice per SPK. SPK yang semua terminnya sudah ditagih tidak tampil.
  function konsRows(){
    const q = g('invSearch') ? g('invSearch').value.trim().toLowerCase() : '';
    return SPKS.map(s => ({s, ti: s.top.findIndex((_, i) => !s.doneIdx.includes(i))})).filter(({s, ti}) => ti >= 0 && s.year === applied.year
      && has(q, [s.company, s.noSpk, s.customer, s.project, s.leader, s.sales, s.top[ti].nama]));
  }
  // Tab Invoiced: filter dari tanggal invoice, urut tanggal invoice terbaru lalu nomor terbesar.
  function invRows(){
    const q = g('ivSearch') ? g('ivSearch').value.trim().toLowerCase() : '';
    return INVOICED.filter(r => +r.date.slice(0, 4) === appliedInv.year && (appliedInv.month === '' || +r.date.slice(5, 7) === +appliedInv.month)
      && (appliedInv.company === '' || r.company === appliedInv.company) && has(q, [r.no, r.spk, r.customer, r.project, r.company, r.leader, r.sales]))
      .sort((x, y) => y.date.localeCompare(x.date) || y.no.localeCompare(x.no));
  }
  function renderList(){
    const rows = konsRows(), tb = g('invBody');
    g('dtInfo').textContent = `Showing ${rows.length ? 1 : 0} to ${rows.length} of ${rows.length} entries`;
    tb.innerHTML = rows.length ? rows.map(({s, ti}, i) => `<tr>
      <td class="no">${i + 1}</td>
      <td><div class="doc">Belum ada invoice</div><div class="sub">SPK: ${esc(s.noSpk)} &middot; ${esc(s.top[ti].nama)}</div></td>
      <td>${custCell(s)}</td><td>${esc(s.company)}</td><td>${tim(s)}</td>
      <td><span class="label label-warning">Uninvoiced</span></td>
      <td class="act"><button type="button" class="act-btn o" title="Add Invoicing" data-addinv="${s.id}">&#9998;</button>
        <button type="button" class="act-btn b" title="View Plan Tagih" data-plantagih>&#9998;</button></td></tr>`).join('')
      : '<tr><td class="empty" colspan="7">Tidak ada tagihan yang belum di-invoice.</td></tr>';
  }
  // Posisi invoice: yang ada di Follow Up Piutang memakai data di sana (sisa dari penerimaan, close), sisanya data contoh.
  function invState(r){
    const d = all().find(x => x.no === r.no);
    return d ? {sisa: d.sisa, closed: !!d.closed, fu: true} : {sisa: r.sisa, closed: !!r.closed, fu: false};
  }
  // INV-FR-10: Close di menu Invoicing hanya bila invoice sudah lunas (sisa piutang 0 persis).
  const invCloseBlock = st => st.closed ? 'Invoice sudah close' : st.sisa > 0 ? 'Belum lunas, sisa piutang ' + rp(st.sisa) : '';
  function renderInv(){
    const rows = invRows(), tb = g('ivBody'), inFu = new Set(DATA.map(r => r.no));
    g('ivInfo').textContent = `Showing ${rows.length ? 1 : 0} to ${rows.length} of ${rows.length} entries`;
    tb.innerHTML = rows.length ? rows.map((r, i) => {
      const link = inFu.has(r.no);
      return `<tr class="${state.flash === r.no ? 'flash' : ''}">
      <td class="no">${i + 1}</td>
      <td><div class="doc">${link ? `<button type="button" class="linkbtn invno" data-goedit="${esc(r.no)}" title="Buka di Follow Up Piutang">${esc(r.no)}</button>` : esc(r.no)}</div><div class="sub">SPK: ${esc(r.spk)}</div></td>
      <td>${fdate(r.date)}</td><td>${custCell(r)}</td><td>${esc(r.company)}</td><td>${tim(r)}</td>
      <td>${(() => { const st = invState(r); return st.closed ? '<span class="label label-default chg">Close</span>'
        : '<span class="label label-success">Invoiced</span>' + (r.jur ? ' <span class="label label-info chg" title="Jurnal invoice sudah diposting">Journaled</span>' : ''); })()}</td>
      <td class="act chg">${(() => { const st = invState(r), blk = invCloseBlock(st);
        return `<div class="inv-acts"><button type="button" class="btn btn-xs" data-ivact="lihat" data-no="${esc(r.no)}">Lihat</button>
        <button type="button" class="btn btn-xs" data-ivact="invoice" data-no="${esc(r.no)}">Cetak invoice</button>
        <button type="button" class="btn btn-xs" data-ivact="kwitansi" data-no="${esc(r.no)}">Cetak kwitansi</button>
        <button type="button" class="btn btn-xs btn-danger" data-ivact="close" data-no="${esc(r.no)}" ${blk ? 'disabled title="' + esc(blk) + '"' : 'title="Close invoice (sudah lunas)"'}>Close</button></div>`; })()}</td></tr>`;
    }).join('') : '<tr><td class="empty" colspan="8">Tidak ada invoice untuk filter ini.</td></tr>';
    if (state.flash && rows.some(r => r.no === state.flash)) state.flash = null;
  }
  let closeNo = '';
  function openInvClose(no){
    const r = INVOICED.find(x => x.no === no), st = invState(r); if (invCloseBlock(st)) return;
    closeNo = no; g('ivCloseTitle').textContent = 'Close Invoice ' + no; g('ivCloseKet').value = ''; g('ivCloseErr').textContent = '';
    g('ivClose').classList.remove('hidden'); g('ivCloseKet').focus();
  }
  function doInvClose(){
    const ket = g('ivCloseKet').value.trim();
    if (!ket){ g('ivCloseErr').textContent = 'Mohon isi alasan penutupan invoice terlebih dahulu.'; return; }
    const r = INVOICED.find(x => x.no === closeNo), st = invState(r);
    if (invCloseBlock(st)){ g('ivCloseErr').textContent = 'Invoice belum lunas (sisa piutang masih ada), belum bisa ditutup.'; return; }
    const d = DATA.find(x => x.no === closeNo);
    if (d){ d.closed = {tgl: TODAY_ISO, ket}; d.log.unshift({wkt: TODAY_ISO + ' ' + new Date().toTimeString().slice(0, 5), user: 'Finance', aksi: 'close', isi: 'Dari menu Invoicing: ' + ket}); }
    else r.closed = true;
    g('ivClose').classList.add('hidden'); renderInv();
    toast('Invoice ' + closeNo + ' sudah close' + (d ? ' (ikut pindah ke Invoice Close di Follow Up Piutang).' : '.'));
  }
  function showTab(k){
    invTab = k;
    document.querySelectorAll('[data-invtab]').forEach(b => { const on = b.dataset.invtab === k; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
    g('paneKons').classList.toggle('hidden', k !== 'kons'); g('paneNon').classList.toggle('hidden', k !== 'non'); g('paneInv').classList.toggle('hidden', k !== 'inv');
  }
  // Ekspor Excel: kolom sama dengan export server (10 kolom pertama), baris = hasil filter aktif tab itu.
  const XL_HEAD = ['No.', 'No. Invoice', 'Tanggal Invoice', 'Company', 'No. SPK', 'Customer', 'Project', 'Project Leader', 'Sales', 'Status'];
  function exportKons(){
    const rows = konsRows(), file = 'Invoicing_Konsultasi_' + applied.year + '.xlsx';
    const aoa = [XL_HEAD, ...rows.map(({s, ti}, i) => [i + 1, '', '', s.company, s.noSpk, s.customer, s.project + ' - ' + s.top[ti].nama, s.leader, s.sales, 'Uninvoiced'])];
    if (xlsxDownload(file, [{name: 'Konsultasi', aoa, widths: [6, 14, 14, 14, 24, 36, 50, 22, 22, 12]}])) toast('Excel terunduh: ' + file + ' (' + rows.length + ' baris).');
  }
  function exportInv(){
    const rows = invRows(), f = appliedInv;
    const file = 'Invoicing_Invoiced_' + f.year + (f.month ? '_' + String(f.month).padStart(2, '0') : '') + (f.company ? '_' + f.company : '') + '.xlsx';
    const aoa = [XL_HEAD, ...rows.map((r, i) => [i + 1, r.no, xd(r.date), r.company, r.spk, r.customer, r.project, r.leader, r.sales, 'Invoiced'])];
    if (xlsxDownload(file, [{name: 'Invoiced', aoa, from: 2, fmt: {C: 'dd-mm-yyyy'}, widths: [6, 14, 14, 14, 24, 36, 50, 22, 22, 12]}])) toast('Excel terunduh: ' + file + ' (' + rows.length + ' invoice).');
  }

  // ---- COA Penjualan (gaya select2 di tabel jurnal) ----
  function s2Html(){
    const c = SALES_COAS.find(x => x.name === salesPick);
    const label = c ? `${c.no} - ${esc(c.name)}` : '-- Pilih COA Penjualan --';
    const items = SALES_COAS.map(x => `<li data-name="${esc(x.name)}" class="${x.name === salesPick ? 'sel' : ''}">${x.no} - ${esc(x.name)}</li>`).join('');
    return `<div class="s2${coaErr ? ' err' : ''}"><div class="s2-box" id="s2Box"><span class="${c ? '' : 'ph'}">${label}</span><i class="s2-arrow"></i></div>
      <div class="s2-drop hidden" id="s2Drop"><input type="text" class="s2-search" id="s2Search" autocomplete="off"><ul id="s2List">${items}<li class="nores hidden">No results found</li></ul></div></div>`;
  }
  function closeS2(){ const d = g('s2Drop'); if (d) d.classList.add('hidden'); }
  function filterS2(q){
    q = q.trim().toLowerCase(); let any = false;
    document.querySelectorAll('#s2List li[data-name]').forEach(li => { const ok = li.textContent.toLowerCase().includes(q); li.classList.toggle('hidden', !ok); if (ok) any = true; });
    const nr = document.querySelector('#s2List li.nores'); if (nr) nr.classList.toggle('hidden', any);
  }
  // Listener dokumen dipasang sekali; aman saat halaman Invoicing tidak tampil (elemen tidak ada).
  document.addEventListener('click', e => {
    const box = e.target.closest('#s2Box'), item = e.target.closest('#s2List li[data-name]');
    if (box){
      const d = g('s2Drop');
      if (d.classList.contains('hidden')){
        const r = box.getBoundingClientRect();
        d.style.left = r.left + 'px'; d.style.top = r.bottom + 'px'; d.style.width = r.width + 'px';
        d.classList.remove('hidden'); s2OpenedAt = Date.now(); g('s2Search').value = ''; filterS2(''); g('s2Search').focus();
      } else d.classList.add('hidden');
      return;
    }
    if (item){ salesPick = item.dataset.name; coaErr = false; recalc(); return; }
    if (e.target.closest('#s2Drop')) return;
    closeS2();
  });
  document.addEventListener('input', e => { if (e.target.id === 's2Search') filterS2(e.target.value); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeS2(); });
  window.addEventListener('scroll', e => { if (Date.now() - s2OpenedAt < 400) return; if (!(e.target.closest && e.target.closest('#s2Drop'))) closeS2(); }, true);

  function showView(name){
    g('viewList').classList.toggle('hidden', name !== 'list');
    g('viewAdd').classList.toggle('hidden', name !== 'add');
    window.scrollTo(0, 0);
  }
  // Nomor invoice di-generate sistem (running number per company per tahun). Di mockup: nomor dari data klien,
  // atau nomor berikutnya bila sudah terpakai di daftar invoice.
  function nextInvoiceNo(want){
    const used = new Set(DATA.map(r => r.no).concat(INVOICED.map(r => r.no)));
    if (!used.has(want)) return want;
    const [, code, year] = want.split('/');
    const max = DATA.map(r => r.no).concat(INVOICED.map(r => r.no)).map(n => n.split('/')).filter(p => p[1] === code && p[2] === year).reduce((a, p) => Math.max(a, +p[0] || 0), 0);
    return pad3(max + 1) + '/' + code + '/' + year;
  }
  const pad3 = n => String(n).padStart(3, '0');
  function openAdd(id){
    cur = SPKS.find(s => s.id === id);
    const today = new Date(TODAY_ISO + 'T00:00:00');
    g('tanggalVal').value = pad(today.getDate()) + '/' + pad(today.getMonth() + 1) + '/' + today.getFullYear();
    tanggalJurnal = pad(today.getDate()) + '-' + MONTH_EN[today.getMonth()] + '-' + today.getFullYear();
    currentInvoiceNo = nextInvoiceNo(cur.noInvoice);
    g('nomorInvoiceVal').value = currentInvoiceNo;
    g('kepadaVal').textContent = cur.kepada; g('alamatVal').textContent = cur.alamat; g('ditujukanVal').textContent = cur.ditujukan;
    curPpn = cur.ppn; g('ppnSelect').value = curPpn; g('ppnSelect').disabled = !cur.ppnEditable;
    g('nomorPo').value = ''; g('nomorFaktur').value = ''; g('nomorPo').classList.remove('err'); g('nomorFaktur').classList.remove('err');
    salesPick = ''; coaErr = false;
    const next = cur.top.findIndex((_, i) => !cur.doneIdx.includes(i));
    visibleIdx = next >= 0 ? [next] : []; selected = new Set(visibleIdx);
    renderTop(); recalc(); showView('add');
  }
  function renderTop(){
    g('topBody').innerHTML = visibleIdx.map((ti, n) => { const t = cur.top[ti];
      return `<tr><td class="c link">${n + 1}</td><td class="tp">${t.nama}</td><td class="c">${t.pct.toFixed(2)}%</td><td class="r">${fmt(t.nominal)}</td><td>${esc(t.desc)}</td></tr>`; }).join('');
    const done = cur.doneIdx.map(i => cur.top[i].nama).join(', ');
    g('topNote').textContent = done ? `Termin yang sudah ditagih: ${done}.` : '';
  }
  function recalc(){
    const type = curPpn;
    let dpp = 0; selected.forEach(i => dpp += cur.top[i].nominal);
    // DPP Nilai Lain 11/12; PPN 12% dari DPP Nilai Lain; pembulatan ke rupiah di tiap tahap (perlu konfirmasi tim pajak).
    const dppLain = Math.round(dpp * 11 / 12), ppn = Math.round(dppLain * 0.12);
    const penjualan = dpp, totalTagihan = dpp + ppn;
    g('vPenjualan').textContent = fmt(penjualan); g('vDpp').textContent = fmt(dppLain); g('vPpn').textContent = fmt(ppn); g('vTotal').textContent = fmt(totalTagihan);
    const salesAcc = salesPick || '-';
    let rows;
    if (type === 'PKP') rows = [{coa:'1102-01-01', acc:'Piutang Dagang Usaha', d:totalTagihan, c:0}, {coa:'2104-01-07', acc:'Hutang PPN DN', d:0, c:ppn}, {sales:true, coa:'', acc:salesAcc, d:0, c:penjualan}];
    else if (type === 'WAPU') rows = [{coa:'1106-01-XX', acc:'Uang Muka PPN WAPU', d:ppn, c:0}, {coa:'1102-01-01', acc:'Piutang Dagang Usaha', d:penjualan, c:0}, {coa:'2104-01-XX', acc:'Hutang PPN WAPU', d:0, c:ppn}, {sales:true, coa:'', acc:salesAcc, d:0, c:penjualan}];
    else rows = [{coa:'1102-01-01', acc:'Piutang Dagang Usaha', d:penjualan, c:0}, {sales:true, coa:'', acc:salesAcc, d:0, c:penjualan}];
    lastPiutang = rows.find(r => r.acc === 'Piutang Dagang Usaha').d;
    let dT = 0, cT = 0;
    if (dpp === 0) g('journalBody').innerHTML = '<tr><td class="empty" colspan="7">Tidak ada termin yang bisa ditagih.</td></tr>';
    else g('journalBody').innerHTML = rows.filter(r => r.d || r.c).map(r => {
      dT += r.d; cT += r.c;
      const desc = (r.sales && !salesPick) ? '-' : [r.acc, currentInvoiceNo, cur.noSpk].concat(type === 'KB' ? ['Kawasan Berikat'] : []).join(' - ');
      return `<tr><td>${tanggalJurnal}</td><td>${esc(cur.company)}</td><td class="coa-cell">${r.sales ? s2Html() : r.coa}</td><td>${esc(r.acc)}</td><td class="desc">${esc(desc)}</td><td class="r">${num(r.d)}</td><td class="r">${num(r.c)}</td></tr>`;
    }).join('');
    g('jFootDebit').textContent = num(dT); g('jFootCredit').textContent = num(cT);
    g('invArNote').innerHTML = dpp ? `ⓘ Setelah Save, invoice <b>${esc(currentInvoiceNo)}</b> masuk Follow Up Piutang (tab 1. Kirim Invoice) dengan nilai piutang <b>${rp(lastPiutang)}</b> (debit Piutang Dagang Usaha).` : '';
  }
  function save(){
    const po = g('nomorPo'), fk = g('nomorFaktur');
    po.classList.toggle('err', !po.value.trim()); fk.classList.toggle('err', !fk.value.trim());
    if (!selected.size){ toast('Tidak ada termin yang bisa ditagih.'); return; }
    coaErr = !salesPick; recalc();
    if (!po.value.trim() || !fk.value.trim()){ toast('Nomor PO dan Nomor Faktur wajib diisi.'); return; }
    if (!salesPick){ toast('COA Penjualan wajib dipilih di tabel jurnal.'); return; }
    const ti = visibleIdx[0], t = cur.top[ti], no = currentInvoiceNo;
    DATA.push({no, tgl: TODAY_ISO, cust: cur.customer, comp: COMP_BY_CODE[no.split('/')[1]] || 'STM', prog: cur.project + ' - ' + t.nama,
      spk: cur.noSpk, top: t.nama, topKe: ti + 1, resi: '',
      nilai: lastPiutang, bayar: [], kirim: null, via: '', ketKirim: '', terima: null, ketTerima: '', pic: '', picTelp: '',
      fu: [0, 1, 2, 3].map(() => ({plan: null, aktual: null, ket: ''})), planBayar: null, ketPlan: '', closed: null,
      log: [{wkt: TODAY_ISO + ' ' + new Date().toTimeString().slice(0, 5), user: 'Finance', aksi: 'buat invoice', isi: 'Dari menu Invoicing: ' + t.nama + ' SPK ' + cur.noSpk + ' (PO ' + po.value.trim() + ', Faktur ' + fk.value.trim() + ')'}]});
    cur.doneIdx.push(ti); cur.issued.push(no);
    if (cur.top.every((_, i) => cur.doneIdx.includes(i))) cur.status = 'Invoiced';
    INVOICED.push({no, date: TODAY_ISO, jur: false, spk: cur.noSpk, customer: cur.customer, project: cur.project + ' - ' + t.nama, company: cur.company, leader: cur.leader, sales: cur.sales});
    // Termin hilang dari tab Konsultasi; filter tab Invoiced diarahkan ke tahun invoice supaya invoice baru langsung terlihat.
    appliedInv = {year: +TODAY_ISO.slice(0, 4), month: '', company: ''};
    g('ivYear').value = appliedInv.year; g('ivMonth').value = ''; g('ivCompany').value = ''; g('ivSearch').value = '';
    state.flash = no; showView('list'); renderList(); renderInv(); showTab('inv');
    toast('Invoice ' + no + ' tersimpan, masuk tab Invoiced dan Follow Up Piutang (tab 1. Kirim Invoice).');
  }

  function mount(){
    renderList(); renderInv();
    document.querySelectorAll('[data-invtab]').forEach(b => b.addEventListener('click', () => showTab(b.dataset.invtab)));
    g('invFilter').addEventListener('click', () => { applied = {year: +g('invYear').value}; renderList(); });
    g('invSearch').addEventListener('input', renderList);
    g('invExcel').addEventListener('click', exportKons);
    g('ivFilter').addEventListener('click', () => { appliedInv = {year: +g('ivYear').value, month: g('ivMonth').value, company: g('ivCompany').value}; renderInv(); });
    g('ivSearch').addEventListener('input', renderInv);
    g('ivExcel').addEventListener('click', exportInv);
    g('invBody').addEventListener('click', e => {
      const a = e.target.closest('[data-addinv]'); if (a){ openAdd(a.dataset.addinv); return; }
      if (e.target.closest('[data-plantagih]')) toast('View Plan Tagih tidak termasuk mockup ini.');
    });
    g('ivBody').addEventListener('click', e => {
      const b = e.target.closest('[data-ivact]'); if (!b || b.disabled) return;
      const no = b.dataset.no, k = b.dataset.ivact;
      if (k === 'lihat'){ if (DATA.some(x => x.no === no)) openDetail(no); else toast('Detail invoice ' + no + ': data contoh, tidak termasuk mockup ini.'); return; }
      if (k === 'invoice' || k === 'kwitansi'){ toast('Cetak ' + (k === 'invoice' ? 'invoice' : 'kwitansi') + ' tidak termasuk mockup ini.'); return; }
      openInvClose(no);
    });
    g('ivCloseOk').addEventListener('click', doInvClose);
    g('ivCloseCancel').addEventListener('click', () => g('ivClose').classList.add('hidden'));
    g('btnSave').addEventListener('click', save);
    g('btnBack').addEventListener('click', () => showView('list'));
    g('ppnSelect').addEventListener('change', e => { curPpn = e.target.value; recalc(); });
  }
  return {html, mount, reset};
})();

/* ================= Navigasi & event ================= */
function show(){
  document.querySelectorAll('.side a[data-go]').forEach(a => a.classList.toggle('on', a.dataset.go === state.page));
  if (state.page === 'inv'){ $('#main').innerHTML = INV.html(); INV.mount(); return; }
  $('#main').innerHTML = state.page === 'mp' ? pageMP() : state.page === 'pb' ? pagePB() : pageFU();
  state.page === 'mp' ? renderMP() : state.page === 'pb' ? renderPB() : renderFU();
  bindInputs();
}
function bindInputs(){
  const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };
  on('#fCompany', 'change', e => { state.comp = e.target.value; show(); });
  on('#pbYear', 'change', e => { state.pbYear = e.target.value; state.pbMonth = 0; renderPB(); });
  on('#fCust', 'change', e => { state.cust = e.target.value; renderMP(); });
  on('#fSearch', 'input', e => { state.q = e.target.value; renderMP(); });
  on('#fuCust', 'change', e => { state.fuCust = e.target.value; renderFU(); });
  on('#fuSearch', 'input', e => { state.fuQ = e.target.value; renderFU(); });
  on('#fuYear', 'change', e => { state.fuYear = e.target.value; renderFU(); });
  on('#fuFu', 'change', e => { state.fuFu = e.target.value; renderFU(); });
  on('#fuBulan', 'change', e => { state.fuBulan = e.target.value; renderFU(); });
  on('#fuThn', 'change', e => { state.fuThn = e.target.value; renderFU(); });
}
function closeModal(){ document.querySelectorAll('.modal').forEach(m => m.classList.remove('show')); }
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2400); }

document.addEventListener('click', e => {
  const t = e.target;
  const go = t.closest('[data-go]');
  if (go){ if (go.dataset.go === 'x'){ toast('Menu lain tidak termasuk mockup ini.'); return; }
    state.page = go.dataset.go; if (go.dataset.fustatus !== undefined){ state.fuTab = 'open'; state.fuStatus = go.dataset.fustatus; } closeModal(); show(); return; }
  const ge = t.closest('[data-goedit]');
  if (ge){ closeModal(); state.page = 'fu'; state.fuTab = 'open'; state.fuStatus = ''; show(); openForm(ge.dataset.goedit); return; }
  if (t.matches('[data-close]') || t.classList.contains('modal')){ closeModal(); return; }
  const pbc = t.closest('[data-pbm]'); if (pbc){ const m = +pbc.dataset.pbm; state.pbMonth = state.pbMonth === m ? 0 : m; renderPB(); return; }
  if (t.id === 'btnPbExport'){ exportPB(); return; }
  if (t.matches('[data-pball]')){ state.pbMonth = 0; renderPB(); return; }
  const cx = t.closest('[data-cardxl]'); if (cx){ exportMP(cx.dataset.cardxl); return; }
  const card = t.closest('.card:not(.nb)');
  if (card){ const c = card.dataset.cat; state.cat = state.cat === c ? '' : c; renderMP(); return; }
  const tab = t.closest('[data-tab]'); if (tab){ state.tab = tab.dataset.tab; renderMP(); return; }
  const fv = t.closest('[data-fuview]');
  if (fv){ const k = fv.dataset.fuview; state.fuTab = k === 'close' ? 'close' : 'open'; state.fuStatus = k === 'close' ? '' : k;
    if (k !== 'plan_bayar'){ state.fuBulan = ''; state.fuThn = ''; } if (k === 'close' || k === 'plan_bayar') state.fuFu = ''; show(); return; }
  if (t.id === 'btnFuExport'){ exportFU(); return; }
  if (t.matches('[data-closemsg]')){ $('#fuMsg').innerHTML = ''; return; }
  const fs = t.closest('[data-fustatus]'); if (fs){ state.fuStatus = fs.dataset.fustatus; renderFU(); return; }
  const clr = t.closest('[data-clr]');
  if (clr){ const k = clr.dataset.clr; state[k] = ''; if (k === 'comp' || k === 'cust') show(); else { if (k === 'q') $('#fSearch').value = ''; renderMP(); } return; }
  const sb = t.closest('[data-sort]');
  if (sb){ const k = sb.dataset.sort; state.sort = {k, d: state.sort.k === k && state.sort.d === 'desc' ? 'asc' : 'desc'}; renderMP(); return; }
  const su = t.closest('[data-surat]'); if (su){ printSurat(su.dataset.surat); return; }
  const cu = t.closest('tr[data-cust]');
  if (cu){ state.tab = 'inv'; state.cust = cu.dataset.cust; show(); return; }
  const inv = t.closest('[data-inv]'); if (inv){ openDetail(inv.dataset.inv); return; }
  const ed = t.closest('[data-edit]'); if (ed){ openForm(ed.dataset.edit); return; }
  const ci = t.closest('[data-close-inv]'); if (ci && !ci.disabled){ openClose(ci.dataset.closeInv); return; }
  if (t.matches('[data-today]')){ tryDone(FU_ACT, TODAY_ISO, null); return; }
  if (t.matches('[data-fuadd]')){ addExtra(); if (FU_ACT < 0) FU_ACT = FN() - 1; fuRender(); return; }
  if (t.matches('[data-fucancel]')){ dropExtraFrom(FU_ACT + 1); fuRender(); return; }
  if (t.matches('[data-furemove]')){ dropExtraFrom(FU_ACT); FU_ACT = activeFu(); fuRender(); return; }
  const fo = t.closest('[data-fuopen]');
  if (fo){ const i = +fo.dataset.fuopen; FU_OPEN[i] = !FU_OPEN[i]; fuRender(); return; }
  if (t.id === 'btnDoClose'){ doClose(); return; }
  if (t.id === 'btnLog'){ const r = DATA.find(x => x.no === state.editNo);
    $('#logBox').innerHTML = r.log.length ? `<div class="scroll" style="margin-top:10px"><table class="futbl"><thead><tr><th>Waktu</th><th>User</th><th>Aksi</th><th>Isi</th></tr></thead><tbody>${r.log.map(l => `<tr><td>${esc(l.wkt)}</td><td>${esc(l.user)}</td><td>${esc(l.aksi)}</td><td>${esc(l.isi)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="hint" style="margin-top:10px">Belum ada riwayat.</p>'; return; }
  if (t.id === 'btnExport'){ exportMP(); return; }
  if (t.id === 'resetBtn'){ DATA = seed(); INV.reset();Object.assign(state, {comp:'', cust:'', q:'', cat:'', tab:'inv', sort:{k:'umur', d:'desc'}, fuTab:'open', fuStatus:'', fuCust:'', fuQ:'', fuFu:'', fuBulan:'', fuThn:'', pbYear:'2026', pbMonth:0}); closeModal(); show(); toast('Data contoh dikembalikan.'); return; }
});
document.addEventListener('change', e => {
  if (!e.target.closest('#fuForm')) return;
  const n = e.target.name;
  if (n === 'via'){ $('#ketKirimWrap').hidden = !e.target.value; $('#ketKirimLbl').textContent = viaLabel(e.target.value); }
  if (n === 'planBayar') fuRender();
  if (n === 'terima'){ if (!F('akt0').value) F('plan0').value = e.target.value ? addDays(e.target.value, GAP[0]) : ''; fuRender(); }
  if (e.target.matches('.fu-last')){
    const k = e.target.dataset.k, i = FU_LAST;
    if (!e.target.value.trim()){ e.target.value = F(k + i).value; return; } // tidak bisa dikosongkan
    F(k + i).value = e.target.value;
    if (k === 'akt'){ if (FU_ACT === i + 1) F('plan' + FU_ACT).value = addDays(e.target.value, gapOf(FU_ACT)); fuRender(); }
    return;
  }
  if (e.target.matches('.fu-in[data-k="akt"]')){
    if (!e.target.value){ if (F('akt' + FU_ACT).value) setAkt(FU_ACT, ''); return; }
    if (e.target.value !== F('akt' + FU_ACT).value) tryDone(FU_ACT, e.target.value, e.target);
    return;
  }
  steps();
});
document.addEventListener('input', e => {
  if (!e.target.closest('#fuForm')) return;
  if (e.target.matches('.fu-in[data-k="plan"], .fu-in[data-k="ket"]')) F(e.target.dataset.k + FU_ACT).value = e.target.value;
  if (e.target.matches('.fu-next')) F('plan' + (FU_ACT + 1)).value = e.target.value;
  steps();
});
document.addEventListener('submit', e => { if (e.target.id === 'fuForm'){ e.preventDefault(); saveForm(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card[role="button"]')){ e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && e.target.matches('tr[data-inv],tr[data-cust]')) e.target.click();
});
$('#chgToggle').addEventListener('change', e => document.body.classList.toggle('show-chg', e.target.checked));
show();
</script>
</body>
</html>
